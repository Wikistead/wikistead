# Server integration-test middleware — FULLY ISOLATED from the dev AND e2e stacks.
#   - separate compose project (name: wikistead-server-test) => separate containers/network
#   - separate named volumes => test seed/teardown never touches dev (or e2e) data
#   - distinct host ports => can run alongside both the dev and e2e stacks
# This is the #268 fix: `pnpm --filter @wikistead/server test` runs against THIS stack
# (via .env.server-test), so the destructive tests (billing.test wipes spaces,
# plan-freeze mutates members, the tenant/oidc tests INSERT rows) never touch the dev DB.
# #388: the service definitions live in docker-compose.middleware.yml (shared with dev/e2e);
# this file carries ONLY the server-test diffs (host ports, srvtest_* volumes, the S3 CORS origin).
name: wikistead-server-test

services:
  postgres:
    extends: { file: docker-compose.middleware.yml, service: postgres }
    ports: ["5434:5432"]
    volumes:
      - srvtest_pgdata:/var/lib/postgresql/data

  valkey:
    extends: { file: docker-compose.middleware.yml, service: valkey }
    ports: ["6381:6379"]

  # #338 / ADR-128: postgres datastore (parity with dev + prod). Ephemeral by design — the server-test teardown
  # `down -v` wipes the volume, so isolation is preserved; the migrate just re-runs on the fresh volume.
  openfga-migrate:
    extends: { file: docker-compose.middleware.yml, service: openfga-migrate }
    depends_on:
      postgres: { condition: service_healthy }

  openfga:
    extends: { file: docker-compose.middleware.yml, service: openfga }
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    ports: ["8092:8080", "8093:8081"]

  meilisearch:
    extends: { file: docker-compose.middleware.yml, service: meilisearch }
    ports: ["7702:7700"]
    volumes: ["srvtest_meilidata:/meili_data"]

  # SeaweedFS S3 on host :9003 (matches the e2e stack's storage choice).
  seaweedfs:
    extends: { file: docker-compose.middleware.yml, service: seaweedfs }
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=http://dev.localhost:5180"
    ports: ["9003:8333"]
    volumes:
      - srvtest_seaweeddata:/data

  mailpit:
    extends: { file: docker-compose.middleware.yml, service: mailpit }
    ports: ["1027:1025", "8027:8025"] # distinct host ports so dev + e2e + server-test coexist

volumes:
  srvtest_pgdata:
  srvtest_meilidata:
  srvtest_seaweeddata:
