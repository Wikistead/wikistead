    get: { operationId: listMembers, tags: [members], summary: List tenant members, responses: { "200": { description: Members }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) } , default: { $ref: "#/components/responses/Error" } }  }
  /members/{sub}/password-setup:
    # An admin gives an EXISTING member a password entrance. It mints a
    # setup link; the member chooses the password. The credential binds to the sub they already have —
    # membership, seat and tuples are untouched, which is what tells this apart from a password invite.
    post:
      operationId: enableMemberPassword
      tags: [members]
      summary: Give an existing member a password entrance (admin only)
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "{ setupUrl, email }" }
        "400": { description: "`password_setup_unavailable` — password sign-in is off for this tenant, the member has no address, or already has a password. `deployment_has_no_address` — this deployment has no verified custom domain and no WKS_PUBLIC_BASE_URL configured, so no link can be built; set one and retry." }
        "401": { description: Missing or invalid credentials }
        "403": { description: Permitted to see the resource but not to perform this action }
        "404": { description: Not viewable or absent (uniform — existence hiding) }
        default: { $ref: "#/components/responses/Error" }
  /members/{sub}/factors:
    # An admin clears a member's second factors so they can enrol
    # again after losing the device. It HANDS NOTHING BACK — no link, no token — because a recovery URL
    # minted for a second factor would be a way past the second factor. The member signs in the
    # ordinary way and meets the enrolment step. Sessions end with the factors: the device they were
    # satisfied on may be in somebody else's hands.
    delete:
      operationId: resetMemberFactors
      tags: [members]
      summary: Clear a member's second factors so they can enrol again (admin only)
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ removed } — the count, and nothing else" }
        "401": { description: Missing or invalid credentials }
        "403": { description: Permitted to see the resource but not to perform this action }
        "404": { description: Not viewable or absent (uniform — existence hiding) }
        "409": { description: "Aimed at yourself (`reset_self`) — your own factor proves itself first (§8)" }
        default: { $ref: "#/components/responses/Error" }
  /members/{sub}/suspend:
    # An admin suspends a member. Sign-in is blocked, tenant and group grants are
    # stripped, API keys are revoked and sessions end. The row, the external id and the SEAT stay
    # (ruling 1: a suspension is not a way to stop paying for somebody).
    post:
      operationId: suspendMember
      tags: [members]
      summary: Suspend a member (admin only)
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ suspended, alreadySuspended }" }
        "401": { description: Missing or invalid credentials }
        "403": { description: Permitted to see the resource but not to perform this action }
        "404": { description: Not viewable or absent (uniform — existence hiding) }
        "409": { description: "The last admin (`last_admin`), or yourself (`self_suspend`)" }
        default: { $ref: "#/components/responses/Error" }
  /members/{sub}/reactivate:
    # The pair. Only an admin's own suspension is the console's to undo: a directory removal is reversed
    # in the directory (ruling 4) and a plan freeze by upgrading (ruling 5). Roles a group conferred do
    # NOT come back here — the identity provider re-adds those.
    post:
      operationId: reactivateMember
      tags: [members]
      summary: Bring a suspended member back (admin only)
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ reactivated }" }
        "401": { description: Missing or invalid credentials }
        "403": { description: Permitted to see the resource but not to perform this action }
        "404": { description: Not viewable or absent (uniform — existence hiding) }
        "409": { description: "Not this console's suspension (`not_your_suspension`), or no free seat (`seat_limit`)" }
        default: { $ref: "#/components/responses/Error" }
