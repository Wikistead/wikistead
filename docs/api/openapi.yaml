  # ── Spaces ───────────────────────────────────────────────────────────────
  /spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List spaces the caller can view (with their capability) — paged, filterable by name
      description: >-
        A keyset page ({ spaces, nextCursor }); walk nextCursor for the roster, including
        over empty pages (authorization filters after the SQL). `q` filters by name SERVER-side, so a
        picker's filter matches every space the caller may see; a cursor is bound to the q that minted
        it — a mismatched cursor restarts from the top and the response says so (`restarted`). No total
        is reported, deliberately: a count over the filtered walk would leak unauthorized density (the
        search route's precedent).
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Case-insensitive name substring filter." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "The keyset cursor from the previous page (bound to its q AND order)." }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "Rows per page (clamped)." }
        - { name: order, in: query, required: false, schema: { type: string, enum: [created, name] }, description: "`name` walks a (lower(name), id) keyset — the browse order; default is created." }
      responses: { "200": { description: Spaces, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Space" } } } } }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a space
      responses: { "201": { description: Created }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /spaces/resolve:
    post:
      operationId: resolveSpaces
      tags: [spaces]
      summary: Resolve spaces by id, in one batch — the id-holding surfaces' path
      description: >-
        Body { ids } (1..100). Answers EVERY requested id, uniformly: a space the caller cannot
        view and a space that does not exist are both null — byte-identical, never an existence
        oracle. Resolved entries carry the same shape (capability, deleteMode, homePageId, icon) as
        the listing. An authorization-infrastructure error rejects the whole request rather than
        silently omitting entries a client would read as "deleted".
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string }, minItems: 1, maxItems: 100 } } } } } }
      responses: { "200": { description: "{ spaces: { [id]: Space | null } }" }, "400": { description: "ids missing, empty or over the cap" }, "401": { description: Missing or invalid credentials }, default: { $ref: "#/components/responses/Error" } }
