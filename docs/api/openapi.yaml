# Wikistead member REST API — OpenAPI 3.1.
#
# HAND-MAINTAINED against the Fastify routes (which carry no JSON schemas to generate from); the
# api-inventory-407 test extracts every route from source and fails the build when a member-API route is
# neither documented here nor explicitly listed in its exclusions — so this file cannot silently drift.
#
# Conventions this API keeps everywhere (see docs/api-reference.md):
#   - The tenant is addressed by HOST (each tenant has its own (sub)domain); there is no tenant id in paths.
#   - Authentication: `Authorization: Bearer <api key>` (create keys in the app under Settings → API keys).
#     A `read`-scoped key may only use GET/HEAD; `write` unlocks mutating methods. Browser sessions use a
#     cookie instead — this spec documents the API-key surface.
#   - A resource you may not view is a uniform 404 (indistinguishable from absent — existence hiding);
#     permission-denied on a resource you can see is 403. Content moderation rejections are 422.
#   - Responses are JSON unless noted. Errors: `{ "message": string }` (+ optional machine fields).
openapi: 3.1.0
info:
  title: Wikistead API
  version: 0.1.0
  # The document, like the CE source it describes, ships under the repository's licence.
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
  description: >
    Member REST API for a Wikistead tenant. Every request is scoped to the tenant addressed by the
    request Host. All list endpoints return only what the caller may view (server-side authorization —
    OpenFGA — filters every item; counts never leak hidden resources).
servers:
  - url: https://{tenantHost}/api
    variables:
      tenantHost:
        default: your-tenant.example.com
security:
  - apiKey: []
# Declared so Swagger UI groups operations in this order (an undeclared tag still groups, but the
# order is then whatever the spec happens to list first).
tags:
  - { name: pages, description: "Pages, their content, revisions and trash" }
  - { name: spaces, description: "Spaces and their page trees" }
  - { name: discovery, description: "Search, tags, backlinks and the local graph" }
  - { name: comments, description: "Page comments and threads" }
  - { name: attachments, description: "File attachments" }
  - { name: share-links, description: "Guest share links" }
  - { name: templates, description: "Reusable page templates" }
  - { name: export, description: "Markdown / HTML export" }
  - { name: members, description: "Tenant members and groups" }
  - { name: watches, description: "Watches and notification preferences" }
  - { name: notifications, description: "The member notification feed" }
  - { name: pins, description: "Pinned resources" }
  - { name: api-keys, description: "API keys" }
  - { name: entitlements, description: "Plan entitlements" }
  - { name: embed, description: "External embed resolution" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key created in Settings → API keys. Scope `read` = GET/HEAD only.
  schemas:
    Error:
      type: object
      properties: { message: { type: string } }
    Page:
      type: object
      description: A page row (fields beyond these may appear; treat unknown fields as additive).
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string }
        title: { type: string }
        parentId: { type: [string, "null"] }
    PageRef:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
    Space:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        capability: { type: string, enum: [view, edit, manage], description: The caller's capability on this space. }
    SearchHit:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        spaceId: { type: string }
        snippet: { type: [string, "null"] }
    LocalGraph:
      type: object
      properties:
        center: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/PageRef" } }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              type: { type: string, enum: [link, embed] }
        hiddenCount: { type: integer, description: Viewable nodes dropped by the server node cap. }
  responses:
    # Every error body in this API is the same shape. Operations reference it as their `default`
    # response, so a generated client knows what to deserialize on any non-2xx — and the Error schema
    # is genuinely used rather than decorative.
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  parameters:
    pageId:
      { name: pageId, in: path, required: true, schema: { type: string } }
    spaceId:
      { name: spaceId, in: path, required: true, schema: { type: string } }
paths:
  # ── Pages ────────────────────────────────────────────────────────────────
  /spaces/{spaceId}/pages:
    get:
      operationId: listSpacePages
      tags: [spaces]
      summary: List the space's pages (tree rows) the caller can view
      parameters: [ { $ref: "#/components/parameters/spaceId" } ]
      responses: { "200": { description: Authorized page rows }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createSpacePage
      tags: [spaces]
      summary: Create a page
      parameters: [ { $ref: "#/components/parameters/spaceId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                parentId: { type: [string, "null"] }
                fromPageId: { type: [string, "null"], description: Seed the body from an existing page (view-gated). }
                templateId: { type: [string, "null"], description: Seed from a template snapshot (view-gated). }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }, "400": { description: Malformed request body }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}:
    get:
      operationId: getPage
      tags: [pages]
      summary: Get a page's metadata
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: Page }, "404": { description: Not viewable or absent (uniform) }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: deletePage
      tags: [pages]
      summary: Move a page (and its subtree) to the trash
      description: Soft delete — the subtree disappears from every surface but stays restorable for 30 days (then it is purged permanently). Requires manage on the page.
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "204": { description: Moved to trash }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/restore:
    post:
      operationId: createPageRestore
      tags: [pages]
      summary: Restore a trashed page (a trash root and everything trashed with it)
      description: "Access comes back exactly as before the trash (grants are never rewritten). If the original parent is gone the root re-parents to the space root (`reparented: true`). Requires manage; a non-root or unknown id is a uniform 404."
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "{ reparented }" }, "404": { description: "Not a trash root, not manageable, or absent (uniform)" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/purge:
    delete:
      operationId: deletePagePurge
      tags: [pages]
      summary: Permanently delete a trashed page (a trash root) before its retention expires
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "204": { description: Purged }, "404": { description: "Not a trash root, not manageable, or absent (uniform)" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/permanent:
    delete:
      operationId: deletePagePermanent
      tags: [pages]
      summary: Permanently delete a LIVE page directly (no trash) — only when the space's delete_mode allows it
      description: "The direct pathway of the delete_mode policy: available under 'both' / 'direct_only', 400 (static policy reason) under 'trash_only'. Requires the delete verb like the trash route; a trashed page stays purge-only (uniform 404 here)."
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "204": { description: Permanently deleted }, "400": { description: Disabled by the delete_mode policy }, "404": { description: "Trashed or absent (uniform)" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/published:
    get:
      operationId: listPagePublished
      tags: [pages]
      summary: Get the published markdown (the read surface)
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "{ title, publishedMd, publishedAt, … }" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/publish:
    post:
      operationId: createPagePublish
      tags: [pages]
      summary: Publish the current draft (creates a revision; no-op when unchanged)
      description: May return 422 when the tenant's abuse filter rejects the content (mass deletion / banned words).
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "{ publishedAt, revisionId, noop }" }, "422": { description: Rejected by the abuse filter }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/revisions:
    get:
      operationId: listPageRevisions
      tags: [pages]
      summary: List revisions (explicit publishes)
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: Revision metadata list }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/revisions/{revId}/content:
    get:
      operationId: listRevisionContent
      tags: [pages]
      summary: Get one revision's content
      parameters:
        - { $ref: "#/components/parameters/pageId" }
        - { name: revId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Revision content }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/move:
    post:
      operationId: createPageMove
      tags: [pages]
      summary: Move a page (reparent / reorder within the tree)
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: Moved }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/revisions/{revId}/restore:
    post:
      operationId: createRevisionRestore
      tags: [pages]
      summary: Restore a revision as the current draft
      parameters:
        - { $ref: "#/components/parameters/pageId" }
        - { name: revId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Restored }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/export:
    get:
      operationId: listPageExport
      tags: [pages]
      summary: Export the page as Markdown
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: Markdown }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/export.html:
    get:
      operationId: listPageExport.html
      tags: [pages]
      summary: Export the page as HTML
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: HTML }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  # ── Discovery (all results server-side view-filtered) ────────────────────
  /search:
    get:
      operationId: listSearch
      tags: [discovery]
      summary: Full-text search (two-stage; every hit re-authorized before return)
      parameters: [ { name: q, in: query, required: true, schema: { type: string } } ]
      responses:
        "200":
          description: Authorized hits
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } }
        "400": { description: Missing or malformed query }
        "401": { description: Missing or invalid credentials }
        default: { $ref: "#/components/responses/Error" }
  /pages/{pageId}/backlinks:
    get:
      operationId: listPageBacklinks
      tags: [pages]
      summary: Pages that link to this page
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "PageRef[]" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/related:
    get:
      operationId: listPageRelated
      tags: [pages]
      summary: 2-hop related pages, grouped by the shared link
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "{ groups, truncated }" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/graph:
    get:
      operationId: listPageGraph
      tags: [pages]
      summary: The local link graph around this page
      parameters:
        - { $ref: "#/components/parameters/pageId" }
        - { name: depth, in: query, schema: { type: integer, enum: [1, 2], default: 1 } }
      responses:
        "200": { description: Graph, content: { application/json: { schema: { $ref: "#/components/schemas/LocalGraph" } } } }
        "401": { description: Missing or invalid credentials }
        "404": { description: Not viewable or absent (uniform — existence hiding) }
        default: { $ref: "#/components/responses/Error" }
  /pages/{pageId}/list:
    get:
      operationId: listPageList
      tags: [pages]
      summary: Resolve a dynamic list directive (`:::tagged` / `:::children`)
      parameters:
        - { $ref: "#/components/parameters/pageId" }
        - { name: name, in: query, required: true, schema: { type: string, enum: [tagged, children] } }
        - { name: body, in: query, schema: { type: string, description: The tag name for `tagged`. } }
      responses: { "200": { description: "PageRef[] (unknown name → [])" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /tags/suggest:
    get:
      operationId: listTagSuggest
      tags: [discovery]
      summary: Tag-name suggestions (only tags carried by ≥1 page the caller can view)
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses: { "200": { description: "{ tag, display }[]" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/excerpt:
    get:
      operationId: listPageExcerpt
      tags: [pages]
      summary: Title + published excerpt (hover previews)
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: "{ title, excerpt }" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /pages/{pageId}/transclude/{refId}:
    get:
      operationId: getPageTransclude
      tags: [pages]
      summary: Resolve an `:::embed-page` reference (page / #section / #^block)
      parameters:
        - { $ref: "#/components/parameters/pageId" }
        - { name: refId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Resolved markdown }, "404": { description: Denied/absent (uniform) }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, default: { $ref: "#/components/responses/Error" } }
  # ── Comments ─────────────────────────────────────────────────────────────
  /pages/{pageId}/comments:
    get:
      operationId: listPageComments
      tags: [pages]
      summary: List the page's comment threads
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      responses: { "200": { description: Threads }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createPageComment
      tags: [pages]
      summary: Start a thread (page-level or anchored inline)
      parameters: [ { $ref: "#/components/parameters/pageId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                kind: { type: string }
                anchorStart: { type: string }
                anchorEnd: { type: string }
                quotedText: { type: string }
                mentions: { type: array, items: { type: string } }
      responses: { "201": { description: Created }, "400": { description: Malformed request body }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /comments/threads/{threadId}/comments:
    post:
      operationId: createThreadComment
      tags: [comments]
      summary: Reply in a thread
      parameters: [ { name: threadId, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string }, mentions: { type: array, items: { type: string } } } } } } }
      responses: { "201": { description: Created }, "400": { description: Malformed request body }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  /comments/{commentId}:
    patch:
      operationId: updateComment
      tags: [comments]
      summary: Edit own comment
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Updated }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete own comment (or moderate)
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      responses: { "204": { description: Deleted }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }
  # ── Attachments ──────────────────────────────────────────────────────────
  /spaces/{spaceId}/pages/paint:
    get:
      operationId: paintSpacePageTree
      tags: [spaces]
      summary: The tree's first paint — the root branch plus the path to the open page
      description: >-
        Opening a page deep in a tree must not require walking down to it, so this answers
        the root branch and each ancestor's own branch (the reader needs the siblings to see where they
        are). `open` is a HINT, never an argument: a page in another space, one that is gone, or one the
        reader cannot see all yield the root branch alone — never an error and never a different shape,
        because a hint that 404s is an oracle for page ids. Each branch is the same bounded,
        individually-confirmed read as the branch route, so the response grows with the DEPTH of the open
        page rather than with the size of the space.
      parameters:
        - { $ref: "#/components/parameters/spaceId" }
        - { name: open, in: query, required: false, schema: { type: string }, description: "The page the reader has open. A hint — an unusable value narrows the answer, never fails it." }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "Rows per branch (clamped)." }
      responses: { "200": { description: The root branch and the path to the open page }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }

  /spaces/{spaceId}/pages/branch:
    get:
      operationId: listSpacePageBranch
      tags: [spaces]
      summary: One branch of the page tree — the children of one parent, bounded and keyset-paged
      description: >-
        The unit is a branch, not a window over the space: a cursor into a depth-first walk
        would mean something different once the reader opens a node. The caller names the parent, so
        `view` is confirmed on the parent itself and every refusal — absent, another tenant's, another
        space's, not viewable — answers one identical 404. Each row is confirmed on its own; a row the
        caller cannot see is absent, with no gap. `cursor` names the ANCHOR ROW BY ID and the server
        resolves its position per request, because a sibling renumber moves rows across a literal
        position in both directions; when the anchor is gone the branch restarts and says so
        (`restarted`), which means the caller must replace what it holds rather than append to it.
      parameters:
        - { $ref: "#/components/parameters/spaceId" }
        - { name: parent, in: query, required: false, schema: { type: string }, description: "The parent page id; absent or `root` means the space's top level." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "The id of the last row already held." }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "Rows per response (clamped)." }
      responses: { "200": { description: One page of the branch }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }

  /spaces/{spaceId}/pages/{pageId}/path:
    get:
      operationId: getSpacePagePath
      tags: [spaces]
      summary: Where a page's row sits in the tree — one level per ancestor, root-first
      description: >-
        The paint fetches the branch of every ancestor, but each comes back as its FIRST
        window, so a page past the window's end is not in the tree at all when the reader lands on a
        link to it. Reading the branch until the row turns up would be unbounded, and the cost would
        fall on whoever was merely sent the link, so this answers WHICH WINDOW instead: for each
        level, the branch to fetch and the cursor that puts the row inside it (`null` means the first
        window, which the paint already has). The rank is counted over the same unfiltered ordering
        the branch route pages over, so the cursor may name a row the caller cannot view — the same
        thing `nextCursor` has always done, and for the same reason. The walk reuses the ancestor
        depth cap and a scan budget; when it runs out the answer says `exhausted` and stops rather
        than pointing at a window that does not hold the row. Every refusal — absent, trashed,
        another space's, not viewable — is one identical 404.
      parameters:
        - { $ref: "#/components/parameters/spaceId" }
        - { name: pageId, in: path, required: true, schema: { type: string }, description: "The page whose row the caller wants to reach." }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "The window size the caller will fetch with; the cursors are only correct for this size." }
      responses: { "200": { description: "One level per ancestor (root-first) and whether the walk was exhausted" }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }

  /spaces/{spaceId}/pages/tree-placeholders:
    get:
      operationId: listSpaceTreePlaceholders
      tags: [spaces]
      summary: The tree's placeholder rows — where something granted sits under something invisible
      description: >-
        A member can hold `view` on a page whose ancestor they cannot see; the tree still
        has to offer a way down to it without naming what is denied. This answers placeholder rows —
        one fixed, unnamed label each, carrying an opaque token and the visible pages granted beneath
        it — resolved OFF the first-paint path so the sidebar never waits on it. The
        walk is budget-bounded; exhausting the budget shortens the answer, never fails it. Members
        only: a guest's share link scopes what they see by itself, so a caller without a member
        session is refused.
      parameters:
        - { $ref: "#/components/parameters/spaceId" }
      responses: { "200": { description: Placeholder rows (possibly empty) }, "401": { description: Missing or invalid credentials }, "403": { description: Permitted to see the resource but not to perform this action }, "404": { description: Not viewable or absent (uniform — existence hiding) }, default: { $ref: "#/components/responses/Error" } }

