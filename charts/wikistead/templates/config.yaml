{{/*
The environment every pod reads.

The production overlay once had none of this, and the first real cluster discovered one required key
at a time. The set below is that overlay's, so the chart and the deployment base answer alike.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wikistead.fullname" . }}-config
  labels: {{- include "wikistead.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  # ⚠️ OpenFGA's in-memory engine loses every tuple on restart, so the API refuses to
  # boot in production unless the engine is stated. Unset is not "default" here, it is a failure.
  OPENFGA_DATASTORE_ENGINE: {{ .Values.openfga.datastoreEngine | quote }}
  VALKEY_URL: {{ include "wikistead.valkeyUrl" . | quote }}
  OPENFGA_API_URL: {{ include "wikistead.openfgaApiUrl" . | quote }}
  MEILI_HOST: {{ include "wikistead.meiliHost" . | quote }}
  S3_ENDPOINT: {{ include "wikistead.s3Endpoint" . | quote }}
  {{- $s3pub := include "wikistead.s3PublicHost" . }}
  {{- if $s3pub }}
  # Presigned URLs are signed for the name the browser will open them under.
  S3_PUBLIC_ENDPOINT: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) $s3pub | quote }}
  {{- end }}
  S3_BUCKET: {{ .Values.seaweedfs.bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.seaweedfs.forcePathStyle | quote }}
  # A browser presigned PUT carries no checksum; without this the SDK signs a URL that demands one.
  AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"
  SERVER_PORT: "4000"
  COLLAB_PORT: "4100"
  {{- if .Values.workspaceHostTemplate }}
  # The shape of a workspace address, declared once rather than guessed. It has to
  # match the wildcard the ingress serves, which is one label shallower than the application's host.
  WKS_TENANT_URL_TEMPLATE: {{ .Values.workspaceHostTemplate | quote }}
  {{- end }}
