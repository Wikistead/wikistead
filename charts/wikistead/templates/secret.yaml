{{- if .Values.secrets.generate }}
{{/*
The simple path, and it is OPT-IN for a reason.

⚠️ This chart ships no credential. What it can do, when asked, is mint random ones on the first
install and keep them: `lookup` reads back what a previous release wrote, so an upgrade does not roll
the guest-token secret and log every anonymous editor out — or, worse, roll the OIDC encryption key
and make every stored connection secret undecryptable.

`lookup` returns nothing during `helm template` and `--dry-run`, so rendering this offline shows fresh
values every time. That is the tool, not a bug in the chart: the cluster is where the previous values
live. It is also why an operator who already has a secret store should leave `generate` false and
point `existingSecret` at what they already trust — SOPS+age through ksops is what this project
uses.
*/}}
{{- $ns := .Release.Namespace -}}
{{- $name := .Values.secrets.existingSecret -}}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict -}}
{{- $old := (get $prev "data") | default dict -}}
{{- $keep := dict -}}
{{- range $k, $v := $old }}{{- $_ := set $keep $k ($v | b64dec) }}{{- end }}
{{- $pg := (get $keep "postgres-password") | default (randAlphaNum 32) -}}
{{- $db := (get $keep "DATABASE_URL") | default (printf "postgres://app:%s@%s-postgres:5432/app" $pg (include "wikistead.fullname" .)) -}}
{{- $s3a := (get $keep "s3-access-key") | default (randAlphaNum 20) -}}
{{- $s3s := (get $keep "s3-secret-key") | default (randAlphaNum 40) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    # Helm would delete and recreate this on an uninstall; keeping it is what makes reinstalling onto
    # an existing database possible at all.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  DATABASE_URL: {{ $db | quote }}
  DATABASE_ADMIN_URL: {{ (get $keep "DATABASE_ADMIN_URL") | default $db | quote }}
  guest-token-secret: {{ (get $keep "guest-token-secret") | default (randAlphaNum 64) | quote }}
  # The bearer a Prometheus scrape presents to the metrics listener. Minted here so a
  # generated install has metrics ON; read it back from the secret for your scrape config.
  metrics-token: {{ (get $keep "metrics-token") | default (randAlphaNum 48) | quote }}
  # The bearer the (opt-in) scimReconcile CronJob presents to the sweep endpoint. Generated
  # unconditionally, same as metrics-token above — it costs nothing on a deployment that never turns
  # scimReconcile on, and staying present means turning it on later never rotates a token something
  # else already read.
  scim-reconcile-token: {{ (get $keep "scim-reconcile-token") | default (randAlphaNum 48) | quote }}
  {{- /* The server requires base64 of EXACTLY 32 bytes (AES-256). randAlphaNum 64 decoded to 48
     bytes and the recommended first-install path could never boot. randBytes 32 emits the base64
     of 32 random bytes, which is precisely the contract. */}}
  OIDC_SECRET_ENC_KEY: {{ (get $keep "OIDC_SECRET_ENC_KEY") | default (randBytes 32) | quote }}
  meili-master-key: {{ (get $keep "meili-master-key") | default (randAlphaNum 32) | quote }}
  s3-access-key: {{ $s3a | quote }}
  s3-secret-key: {{ $s3s | quote }}
  s3-config-json: |
    {"identities":[{"name":"app","credentials":[{"accessKey":"{{ $s3a }}","secretKey":"{{ $s3s }}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
{{- end }}
