{{- $full := include "wikistead.fullname" . -}}
{{- if .Values.hooks.migrate }}
{{/*
Migrations, from the server image.

The SQL ships in that image precisely so this could exist: otherwise a cluster has to carry a
hundred and thirty files in a ConfigMap to get a schema.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-migrate
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.hooks.backoffLimit }}
  template:
    metadata: { labels: { app: {{ $full }}-migrate } }
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "wikistead.image" (list .Values.server .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef: { name: {{ $full }}-config }
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
{{- end }}
