{{- $full := include "wikistead.fullname" . -}}
{{- if .Values.hooks.migrate }}
{{/*
Migrations, from the server image.

#804 put the SQL in that image precisely so this could exist: before it, a cluster had to carry a
hundred and thirty files in a ConfigMap to get a schema (#802 did exactly that, by hand).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-migrate
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.hooks.backoffLimit }}
  template:
    metadata: { labels: { app: {{ $full }}-migrate } }
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "wikistead.image" (list .Values.server .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/scripts/migrate.js"]
          envFrom:
            - configMapRef: { name: {{ $full }}-config }
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
{{- end }}
{{- if .Values.hooks.fgaBootstrap }}
---
{{/*
The authorization store and its model.

⚠️ This hook exists because the ids are decided by the store, not by the operator, and a chart cannot
template a value that does not exist yet — the awkwardness #802 reported from a real cluster.
ADR-250 §4 says plainly what replaces it: when the product resolves its own store by name at startup
(#826), this Job and the `hooks.fgaBootstrap` value go away together. Written here so that removal is
one deletion rather than an archaeology exercise.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-fga-bootstrap
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.hooks.backoffLimit }}
  template:
    metadata: { labels: { app: {{ $full }}-fga-bootstrap } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $full }}-fga-bootstrap
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "wikistead.image" (list .Values.server .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/infra/openfga/bootstrap.js"]
          envFrom:
            - configMapRef: { name: {{ $full }}-config }
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
          env:
            - { name: WKS_WRITE_IDS_TO_SECRET, value: {{ .Values.secrets.existingSecret | quote }} }
            - { name: WKS_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-fga-bootstrap
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-fga-bootstrap
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # ⚠️ One secret, by name, and only to patch it. This Job writes two ids into a credential store, so
  # the narrowest grant that can do the job is the one it gets: no `list`, no other resource, no other
  # name. A wildcard here would give the bootstrap read of every secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.existingSecret | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-fga-bootstrap
  labels: {{- include "wikistead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $full }}-fga-bootstrap }
subjects:
  - { kind: ServiceAccount, name: {{ $full }}-fga-bootstrap, namespace: {{ .Release.Namespace }} }
{{- end }}
