# Wikistead — values. This chart TEMPLATES the deployment base; it does not redesign the
# nine-service shape. When the two disagree the base is the source of truth, and
# `lint:origin-routes` compares the route list in both directions.

# ─────────────────────────────────────────────────────────────────────────────
# Images
#
# A tag is pinnable and so is a digest. `digest` wins when both are set, which is what a
# production deployment should use — a tag is a moving name and a digest is the thing that ran.
# The registry defaults to the placeholder the manifests carry until images are published; a chart
# installed with it fails to pull, which is the honest outcome before any image exists.
image:
  registry: ghcr.io/CHANGE_ME
  # Applies to all three application images unless overridden per service below.
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # e.g. sha256:… — takes precedence over tag
  pullPolicy: IfNotPresent
  pullSecrets: []

server:
  replicas: 1
  image: { repository: wikistead-server, tag: "", digest: "" }
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
collab:
  replicas: 1
  image: { repository: wikistead-collab, tag: "", digest: "" }
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
web:
  replicas: 1
  image: { repository: wikistead-web, tag: "", digest: "" }
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Addresses
#
# `host` is where the application lives. `workspaceHostTemplate` is the SHAPE of a workspace address
# and it is NOT derived from `host`: gluing a slug onto the application's own host produces addresses
# that do not resolve. It has to match whatever wildcard the ingress serves.
host: wikistead.example.com
workspaceHostTemplate: ""   # e.g. https://{slug}.wikistead.example.com — unset closes self-serve creation only

ingress:
  enabled: true
  className: nginx
  # ⚠️ TWO objects, always. The api object rewrites `/api/(.*)` to `/$1`, and a rewrite annotation
  # applies to a whole Ingress — folding the two together makes that rewrite eat every other route.
  # This is not a style choice; measured it on a real cluster.
  #
  # `wildcardHost` adds the `*.host` rule the workspace addresses need. A single-host deployment
  # leaves it off — signup is closed there rather than pointing somewhere unreachable.
  wildcardHost: false
  tls:
    enabled: true
    secretName: kb-tls
    # cert-manager is optional: an operator with their own certificate leaves this empty and creates
    # the secret themselves.
    clusterIssuer: letsencrypt-prod
  # Some controllers refuse `configuration-snippet` outright and reject the whole Ingress with it.
  # Measured on a real cluster: the deployment there had to strip these to come up.
  securityHeaderSnippet: false
  annotations: {}

# ─────────────────────────────────────────────────────────────────────────────
# Secrets
#
# ⚠️ This chart never ships a literal credential. The default is to reference a secret that already
# exists, made by whatever the operator already trusts — SOPS+age through ksops is what this project
# uses.
#
# `generate: true` is the simple path for a first install: the chart mints random values ONCE and
# `lookup` keeps them across upgrades. It is opt-in because a generated secret is invisible to the
# operator's own backup and rotation story.
secrets:
  existingSecret: kb-secrets
  generate: false

# ─────────────────────────────────────────────────────────────────────────────
# Middleware
#
# Each of the five can be bundled or pointed at something the operator already runs. The bundled
# manifests are the ones from deploy/k8s/base, which that file's own comment calls dev-convenience —
# a production install should be turning these off.
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: { size: 20Gi, storageClass: "" }
  # When enabled=false: the URL the application uses. Both databases may live on one server — they
  # are separated by DATABASE, not by host; create the `openfga` database there once.
  externalUrl: ""
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  externalUrl: ""
openfga:
  enabled: true
  image: openfga/openfga:latest
  # ⚠️ `memory` loses every tuple on restart, so the API refuses to boot in production without
  # `postgres`. The chart states it rather than leaving it to a ConfigMap nobody wrote.
  datastoreEngine: postgres
  datastoreUri: ""     # defaults to the bundled postgres
  externalApiUrl: ""
meilisearch:
  enabled: true
  image: getmeili/meilisearch:v1.10
  storage: { size: 10Gi, storageClass: "" }
  externalHost: ""
seaweedfs:
  enabled: true
  image: chrislusf/seaweedfs:latest
  storage: { size: 50Gi, storageClass: "" }
  externalEndpoint: ""
  # The name the BROWSER reaches the in-chart store at. Uploads and downloads are presigned URLs
  # the browser opens itself, and the signature covers the host — so the store needs a public name of
  # its own, not a path on `host`. Empty renders `s3.<host>` and a third Ingress object for it; set it
  # when the public name must differ (a one-label host behind a proxy whose certificate covers only
  # `*.example.com`). Ignored when externalEndpoint points at managed S3/R2, which is public already.
  publicHost: ""
  bucket: attachments
  forcePathStyle: true

# ─────────────────────────────────────────────────────────────────────────────
# Initialization
#
# Two hooks, both from the server image, which carries the migrations.
hooks:
  # Runs the migration entrypoint post-install and post-upgrade.
  migrate: true
  # The fga-bootstrap hook is GONE: the server resolves — or, on a deployment that has never had
  # one, creates — its own OpenFGA store and model at startup, from the model.fga the image
  # carries, so the hook only duplicated that work and could race it.
  backoffLimit: 3

# ─────────────────────────────────────────────────────────────────────────────
# SCIM pending-removal sweep (opt-in)
#
# The correctness backstop for a deferred SCIM removal — a periodic re-check so a hold does not
# outlive its own reason forever if nothing else happens to trigger a re-evaluation first. Off by
# default: it only does anything on a commercial-edition image with SCIM entitled, which this chart's
# own default image is not. Turning it on against the default image costs nothing beyond a job that
# 404s on its own schedule.
scimReconcile:
  enabled: false
  schedule: "0 * * * *"
  image: { repository: curlimages/curl, tag: "8.10.1" }

# Extra environment for the application pods, for anything this chart does not name.
extraEnv: []
nameOverride: ""
fullnameOverride: ""
