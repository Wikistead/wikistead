<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>KB — two-surface PoC</title>
    <style>
      :root { --lp-border: #ddd; --lp-bar-bg: #f5f5f5; --lp-btn-bg: #fff; }
      body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
      .pane { display: flex; flex-direction: column; border-right: 1px solid var(--lp-border); min-width: 0; }
      .pane h2 { font-size: 13px; margin: 0; padding: 8px 12px; background: var(--lp-bar-bg); border-bottom: 1px solid var(--lp-border); }
      .cm-editor { height: 100%; }
      #source { flex: 1; min-height: 0; }
      #preview { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .lp-toolbar { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--lp-border); background: var(--lp-bar-bg); }
      .lp-toolbar-btn { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid var(--lp-border); border-radius: 4px; background: var(--lp-btn-bg); cursor: pointer; }
      .lp-toolbar-btn:hover { background: #ececec; }
      .lp-editor-host { flex: 1; min-height: 0; overflow: auto; }
    </style>
  </head>
  <body>
    <div class="pane"><h2>vim / source (CodeMirror + @replit/codemirror-vim)</h2><div id="source"></div></div>
    <div class="pane"><h2>live preview (non-technical surface — same Y.Text)</h2><div id="preview"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
