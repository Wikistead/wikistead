<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF</title>
    <style>
      /* #273 / ADR-120: the pdf.js render surface inside the sandboxed (opaque-origin) attachment viewer.
         No app chrome — just stacked page canvases on a neutral backdrop. */
      html, body { margin: 0; padding: 0; background: #f3f3f3; }
      #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
      #pages canvas { max-width: 100%; height: auto; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); background: #fff; }
      #msg { font: 13px system-ui, sans-serif; color: #666; padding: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="msg">Loading…</div>
    <div id="pages"></div>
    <script type="module" src="/src/pdf-frame.ts"></script>
  </body>
</html>
