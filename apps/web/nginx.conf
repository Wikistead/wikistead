# Wikistead web (SPA) — served by the CE web image (#414 / ADR-161 pre-slice).
#
# - SPA history fallback: react-router uses the history API, so a deep link or reload on any app path
#   must serve index.html (never a 404). Real files win first (try_files $uri).
# - Hashed assets are immutable → long cache. index.html / pdf-frame.html are the mutable entrypoints
#   → no-cache so a deploy is picked up on next load.
# - /assets/ gets `Access-Control-Allow-Origin: *`: the PDF viewer iframe is an OPAQUE origin
#   (sandbox="allow-scripts", no allow-same-origin — the #273 containment contract), and opaque-origin
#   documents fetch <script type="module"> in CORS mode (Origin: null). These are public static assets
#   served without credentials, so the header enables the frame without weakening any boundary
#   (#273; dev parity lives in the vite config).
# - This serves the SPA ONLY. /api and /collab are routed by the outer reverse proxy
#   (deploy/k8s/base/ingress.yaml or deploy/caddy/Caddyfile) — never by this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # #990 / ADR-277 rev5: Excalidraw's self-hosted fonts (excalidrawFontsPlugin's build output —
    # font-src 'self' depends on these being reachable). The generic `location /` fallback below
    # already serves a real file here correctly (try_files checks $uri before falling to index.html),
    # so this block is not fixing a defect — it is the SAME explicit, real-404, immutable-cache
    # treatment `/assets/` gets, for the SAME reason: a review once mistook a DIFFERENT server's
    # (a throwaway test harness, not this file) SPA-fallback-masks-a-missing-file behavior for a defect
    # here. An explicit block removes that ambiguity for the next reader instead of relying on it being
    # correctly reasoned about from the generic rule every time.
    location /excalidraw/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /pdf-frame.html {
        # The opaque-origin PDF frame document. SAMEORIGIN framing must stay allowed (the app embeds
        # it); a blanket X-Frame-Options: DENY at the proxy would break the viewer (#273).
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
