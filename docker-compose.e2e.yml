# E2E middleware — FULLY ISOLATED from the dev stack.
#   - separate compose project (name: wikistead-e2e) => separate containers/network
#   - separate named volumes => e2e seed/teardown never touches dev data
#   - distinct host ports => can run alongside the dev stack
# Storage is SeaweedFS S3 (the MinIO → SeaweedFS swap is complete — see the storage decision note); the
# server-test stack uses the same image/config on a distinct port.
# #388: the service definitions live in docker-compose.middleware.yml (shared with dev/server-test);
# this file carries ONLY the e2e diffs (host ports, e2e_* volumes, the web origin for S3 CORS).
name: wikistead-e2e

services:
  postgres:
    extends: { file: docker-compose.middleware.yml, service: postgres }
    ports: ["${E2E_PG_PORT:-5433}:5432"]
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data

  valkey:
    extends: { file: docker-compose.middleware.yml, service: valkey }
    ports: ["${E2E_VALKEY_PORT:-6380}:6379"]

  # #338 / ADR-128: postgres datastore (parity with dev + prod). Ephemeral by design — the e2e teardown
  # `down -v` wipes the volume, so isolation is preserved; the migrate just re-runs on the fresh volume.
  openfga-migrate:
    extends: { file: docker-compose.middleware.yml, service: openfga-migrate }
    depends_on:
      postgres: { condition: service_healthy }

  openfga:
    extends: { file: docker-compose.middleware.yml, service: openfga }
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    ports: ["${E2E_FGA_HTTP_PORT:-8090}:8080", "${E2E_FGA_GRPC_PORT:-8091}:8081"]

  meilisearch:
    extends: { file: docker-compose.middleware.yml, service: meilisearch }
    ports: ["${E2E_MEILI_PORT:-7701}:7700"]
    volumes: ["e2e_meilidata:/meili_data"]

  # SeaweedFS S3 on host :${E2E_S3_PORT}; -s3.allowedOrigins carries THIS stack's web origin (browser
  # direct-upload CORS), which shifts with the offset — a mismatch fails uploads silently, so it is
  # derived from the same port map (e2eComposeEnv → E2E_WEB_ORIGIN).
  seaweedfs:
    extends: { file: docker-compose.middleware.yml, service: seaweedfs }
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=${E2E_WEB_ORIGIN:-http://dev.localhost:5180}"
    ports: ["${E2E_S3_PORT:-9002}:8333"]
    volumes:
      - e2e_seaweeddata:/data

  mailpit:
    extends: { file: docker-compose.middleware.yml, service: mailpit }
    ports: ["${E2E_SMTP_PORT:-1026}:1025", "${E2E_MAILPIT_PORT:-8026}:8025"] # distinct host ports so dev + e2e coexist

volumes:
  e2e_pgdata:
  e2e_meilidata:
  e2e_seaweeddata:
