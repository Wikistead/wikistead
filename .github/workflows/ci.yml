name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: `lint:commit-types` compares this branch against master, and the default
      # shallow clone has no master to compare with — it would silently fall back to checking only the
      # last commit, which is a weaker check wearing the same green tick.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm typecheck
      # Static guards (no service infra needed). Tests live in a separate job/run
      # because the integration suite needs Postgres/OpenFGA/Valkey/Meili services.
      - run: pnpm lint:no-ee-imports   # ADR-011/ADR-069 (#176): CE must not import EE namespace or any proprietary (private) pkg
      - run: pnpm lint:no-css-modules  # shadcn/Tailwind migration: no new CSS Modules
      - run: pnpm docs:check           # ADR-080 doc↔code linkage: generated docs not stale
      - run: pnpm lint:doc-links       # ADR-080: warn if a code region changed without its docs page
      - run: pnpm lint:deploy-secrets  # #147/ADR-042no NEW plaintext credential in deploy/ (the known two are owed, not allowed)
      - run: pnpm lint:commit-types    # #138 prep: the release tooling reads these subjects, so the type list is fixed now
  test:
    # #293 / #268: the unit + integration test suite. The server suite runs against the ISOLATED
    # server-test middleware (docker-compose.server-test.yml) brought up, migrated, and seeded by
    # `pnpm setup:server-test` — the SAME flow used locally (compose up --wait -> migrate -> fga
    # bootstrap/seed -> db seed). Kept a SEPARATE job from `build` because it needs Postgres / OpenFGA
    # / Valkey / Meilisearch / SeaweedFS (compose starts them; ubuntu-latest ships docker + compose v2).
    # `pnpm test` = `turbo run test` = every package's unit tests + the server integration suite; the
    # Playwright e2e package has no `test` script so it is not run here (it needs its own stack + browsers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm setup:server-test     # compose up --wait + migrate + fga bootstrap/seed + db seed (#268)
      - run: pnpm test                  # unit (web / macro-render / …) + server integration (real PG + OpenFGA)
      - if: always()
        run: pnpm teardown:server-test || true
  license-check:
    # Enforces the permissive-only dependency allowlist (ADR-011 dual-licensing
    # precondition). Uses scripts/check-licenses.mjs, a pnpm-aware scanner
    # (`pnpm licenses list --prod --json` + an SPDX allowlist) that FAILS on any
    # non-permissive production dependency — it replaced the earlier
    # license-checker-rseidelsohn invocation, which silently passed without
    # scanning under pnpm's symlinked store.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm license:check
  image-boundary:
    # #414 / ADR-162 §4: the CE/EE boundary applied to the ARTIFACT. Builds the server image (the one
    # with a composition risk) and fails if any EE package PATH survives inside it — path-based
    # (ee-server/, entitlements-cloud/), never a namespace grep (entitlements-cloud lives under the
    # regular @wikistead/ scope). Also renders the prod overlay and refuses any :latest image pin
    # (ADR-162 §2 — prod pins are explicit tag+digest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CE server image
        run: docker build -f apps/server/Dockerfile -t ce-boundary-check .
      - name: Assert no EE paths inside the artifact
        run: |
          set -euo pipefail
          hits=$(docker run --rm --entrypoint sh ce-boundary-check -c \
            "find /app \( -path '*/ee-server/*' -o -path '*/entitlements-cloud/*' \) -print | head -5" || true)
          if [ -n "$hits" ]; then
            echo "::error::CE server image contains EE package paths (ADR-084/ADR-162 boundary):"
            echo "$hits"
            exit 1
          fi
      - name: Assert the prod overlay renders no :latest wikistead image
        run: |
          set -euo pipefail
          # wikistead images only — the in-cluster infra images (postgres/openfga/…) are convenience
          # scaffolding the prod overlay replaces with operators/managed services (see PROD NOTES/#423).
          if kustomize build deploy/k8s/overlays/prod | grep -E 'image: .*wikistead-[a-z]+:latest'; then
            echo "::error::prod overlay renders a :latest wikistead image — pins must be explicit (ADR-162)"
            exit 1
          fi
