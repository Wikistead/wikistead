name: ci
on: [push, pull_request]

env:
  # #704 / ADR-225 §4.1: the docs repository whose checkout ARMS the authored half of the
  # doc-links gate. CHANGE_ME = dormant (the step below skips, authored violations stay loud
  # warnings — the pre-#704 behaviour). Flip to e.g. Wikistead/wikistead-docs AFTER the #703
  # scaffold is pushed there (an empty docs repo turns every mapped change red for the wrong
  # reason), and expect the first armed PR to pay the accumulated warning debt (ADR-225
  # §Consequences — that is the point). Public repo, so no token; a set-but-uncloneable value
  # fails the checkout step itself — half-armed is loud, never a silent fall-back to warn
  # (the silent fall-back IS the hole #704 closes).
  DOCS_REPO: CHANGE_ME

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: `lint:commit-types` compares this branch against the integration branch, and
      # the default shallow clone has no such ref to compare with — it would silently fall back to checking only the
      # last commit, which is a weaker check wearing the same green tick.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # No `version:` here on purpose — package.json's `packageManager` is the one source, and
      # naming a second one makes action-setup refuse to run at all. Measured on the FIRST run this
      # workflow ever had (2026-08-18, the day of publication): three jobs dead at setup with
      # "Multiple versions of pnpm specified" while every local gate was green — a workflow file
      # cannot be exercised without an Actions run, and this repository had none until the push.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm typecheck
      # Static guards (no service infra needed). Tests live in a separate job/run
      # because the integration suite needs Postgres/OpenFGA/Valkey/Meili services.
      - run: pnpm lint:no-ee-imports   # ADR-011/ADR-069 (#176): CE must not import EE namespace or any proprietary (private) pkg
      - run: pnpm lint:ee-lever-placement   # #693/#688: an EE lever's enforcement must not read in the CE tree
      - run: pnpm lint:origin-routes        # #724/ADR-231: the edge configs must match the one origin route table
      - run: pnpm lint:selfhost-profile     # #726/ADR-233: the apps profile must be able to serve the product
      - run: pnpm lint:no-css-modules  # shadcn/Tailwind migration: no new CSS Modules
      - run: pnpm lint:no-control-bytes     # #744: a raw NUL makes git call a source file binary, and a binary file has no diff to review
      - run: pnpm docs:check           # ADR-080 doc↔code linkage: generated docs not stale
      # #704: the docs repo lands at the path check-doc-links.mjs treats as the combined checkout
      # (`wikistead-docs/`), arming the authored half of the strict gate below.
      - uses: actions/checkout@v4
        if: env.DOCS_REPO != 'CHANGE_ME'
        with:
          repository: ${{ env.DOCS_REPO }}
          path: wikistead-docs
      - run: pnpm lint:doc-links -- --strict  # ADR-225 §4.1: enforceable doc↔code violations fail CI (generated always; authored when the docs checkout above is armed)
      - run: pnpm lint:deploy-secrets  # #147/ADR-042no NEW plaintext credential in deploy/ (the known two are owed, not allowed)
      - run: pnpm lint:commit-types    # #138 prep: the release tooling reads these subjects, so the type list is fixed now
      - run: node scripts/check-release-derivation.mjs  # #138the version DERIVATION is measured (breaking→major on all three types, 0.x and 1.x)
  test:
    # #293 / #268: the unit + integration test suite. The server suite runs against the ISOLATED
    # server-test middleware (docker-compose.server-test.yml) brought up, migrated, and seeded by
    # `pnpm setup:server-test` — the SAME flow used locally (compose up --wait -> migrate -> fga
    # bootstrap/seed -> db seed). Kept a SEPARATE job from `build` because it needs Postgres / OpenFGA
    # / Valkey / Meilisearch / SeaweedFS (compose starts them; ubuntu-latest ships docker + compose v2).
    # `pnpm test` = `turbo run test` = every package's unit tests + the server integration suite; the
    # Playwright e2e package has no `test` script so it is not run here (it needs its own stack + browsers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` is the one source, and
      # naming a second one makes action-setup refuse to run at all. Measured on the FIRST run this
      # workflow ever had (2026-08-18, the day of publication): three jobs dead at setup with
      # "Multiple versions of pnpm specified" while every local gate was green — a workflow file
      # cannot be exercised without an Actions run, and this repository had none until the push.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      # Build BEFORE the seed: setup's seed imports workspace packages by their dist entrypoints,
      # and a fresh runner has none. Local machines carry stale dist from earlier builds, which is
      # why this gap survived until CI's first real run (2026-08-18: "Cannot find module
      # @wikistead/authz/dist/index.js"). Same rule as every packaged build: build, or the suite
      # dies at load.
      - run: pnpm build
      - run: pnpm setup:server-test     # compose up --wait + migrate + fga bootstrap/seed + db seed (#268)
      # --concurrency=1: one package's suite at a time. The repo's own merge-gate policy already
      # concedes that turbo-parallel runs flake (the project design notes: a lone-green server suite counts when
      # parallelism is the cause; the live-preview unit tests are on record flaking ONLY under full
      # parallelism) — and the 2-core runner makes that contention a certainty, not a tail risk.
      # Measured across the first day's runs: hook timeouts at 60/120s and a live-preview decoration
      # mismatch, every one green in isolation. Wall-clock is the price; a red that means nothing
      # costs more.
      # VITEST_MAX_THREADS=2: inside each package, vitest still runs test FILES in parallel, and on
      # the 2-core runner that parallelism starves OpenFGA — the per-row visibility confirm is
      # fail-closed (correct for the product), so a starved check reads as "row absent" and a
      # presence assertion goes red. Measured: tree-placeholders' chevron case failed 3/3 in the full
      # suite here and passed 3/3 pinned to two cores as a single file. Threads match the cores.
      - run: pnpm test -- --concurrency=1   # unit (web / macro-render / …) + server integration (real PG + OpenFGA)
        env: { VITEST_MAX_THREADS: "2", VITEST_MIN_THREADS: "1" }
      - if: always()
        run: pnpm teardown:server-test || true
  license-check:
    # Enforces the permissive-only dependency allowlist (ADR-011 dual-licensing
    # precondition). Uses scripts/check-licenses.mjs, a pnpm-aware scanner
    # (`pnpm licenses list --prod --json` + an SPDX allowlist) that FAILS on any
    # non-permissive production dependency — it replaced the earlier
    # license-checker-rseidelsohn invocation, which silently passed without
    # scanning under pnpm's symlinked store.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` is the one source, and
      # naming a second one makes action-setup refuse to run at all. Measured on the FIRST run this
      # workflow ever had (2026-08-18, the day of publication): three jobs dead at setup with
      # "Multiple versions of pnpm specified" while every local gate was green — a workflow file
      # cannot be exercised without an Actions run, and this repository had none until the push.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm license:check
  image-boundary:
    # #414 / ADR-162 §4: the CE/EE boundary applied to the ARTIFACT. Builds the server image (the one
    # with a composition risk) and fails if any EE package PATH survives inside it — path-based
    # (ee-server/, entitlements-cloud/), never a namespace grep (entitlements-cloud lives under the
    # regular @wikistead/ scope). Also renders the prod overlay and refuses any :latest image pin
    # (ADR-162 §2 — prod pins are explicit tag+digest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CE server image
        run: docker build -f apps/server/Dockerfile -t ce-boundary-check .
      - name: Assert no EE paths inside the artifact
        run: |
          set -euo pipefail
          hits=$(docker run --rm --entrypoint sh ce-boundary-check -c \
            "find /app \( -path '*/ee-server/*' -o -path '*/entitlements-cloud/*' \) -print | head -5" || true)
          if [ -n "$hits" ]; then
            echo "::error::CE server image contains EE package paths (ADR-084/ADR-162 boundary):"
            echo "$hits"
            exit 1
          fi
      - name: Assert the prod overlay renders no :latest wikistead image
        run: |
          set -euo pipefail
          # filter-ok: the k8s manifests are private infrastructure (#178) — this gate
          # self-disables where they are absent (the public tree) and still runs in the upstream.
          if [ ! -d deploy/k8s ]; then echo "no k8s manifests here — nothing to gate"; exit 0; fi # filter-ok: the guard itself
          # wikistead images only — the in-cluster infra images (postgres/openfga/…) are convenience
          # scaffolding the prod overlay replaces with operators/managed services (see PROD NOTES/#423).
          if kustomize build deploy/k8s/overlays/prod | grep -E 'image: .*wikistead-[a-z]+:latest'; then # filter-ok: guarded above
            echo "::error::prod overlay renders a :latest wikistead image — pins must be explicit (ADR-162)"
            exit 1
          fi
