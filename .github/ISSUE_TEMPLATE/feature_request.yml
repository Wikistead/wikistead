name: Feature request / idea
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Wikistead's north star is a best-in-class **writing experience**, **knowledge-first**,
        **open formats**, and **link-first** (see `the project design notes`). Ideas that pull toward task
        management / CRM / database-centric directions are intentionally out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what's getting in the way today?
      placeholder: I'm trying to … but …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: How you imagine it could work. Rough is fine — the problem matters more than the solution.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds you've tried or thought about.
    validations:
      required: false
