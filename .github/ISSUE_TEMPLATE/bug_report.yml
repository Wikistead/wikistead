name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** report security
        vulnerabilities here — see the [security policy](https://github.com/wikistead/wikistead/security/policy)
        for the private channel.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — expected behaviour vs. what actually happened.
      placeholder: When I …, I expected …, but instead …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that reliably reproduces the problem.
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release tag or `git rev-parse HEAD` you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment shape (self-hosted / dev), OS, browser, and any relevant middleware versions.
    validations:
      required: false
